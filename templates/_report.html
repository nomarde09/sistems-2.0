<h2>Отчёт</h2>
<div class="card report">
  <dl class="details">
    <dt>Выполнил(а)</dt><dd>{{ r.taken_by|who }}, {{ r.done_at|dt }}</dd>
    <dt>Что сделано</dt><dd class="multiline">{{ r.report_work }}</dd>
    <dt>Цена</dt><dd class="price">{{ r.report_price|money }}</dd>
    <dt>Оплата</dt><dd>{{ PAYMENTS.get(r.report_payment) or 'не указана' }}</dd>
    {% if r.report_comment %}<dt>Комментарий</dt><dd class="multiline">{{ r.report_comment }}</dd>{% endif %}
  </dl>
</div>
