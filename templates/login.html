{% extends "base.html" %}
{% block content %}
<div class="card login-card">
  <h1>Вход</h1>
  <p class="muted">Введите свой логин и пароль.</p>
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}
  <form class="login-form" method="post" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label class="field">Логин
      <input type="text" name="login" value="{{ login_text }}" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>
    <label class="field">Пароль
      <input type="password" name="pin" autocomplete="current-password">
    </label>
    <button class="button primary" type="submit">Войти</button>
  </form>
</div>
{% endblock %}
