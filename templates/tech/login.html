{% extends "tech/base.html" %}
{% block tech_content %}
<div class="card login-card">
  <h1>Технический вход</h1>
  <p class="muted">Только для разработчика и системного аудита.</p>
  {% if error %}<p class="alert">{{ error }}</p>{% endif %}
  <form class="login-form" method="post" action="{{ url_for('tech.login') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label class="field">Логин
      <input type="text" name="login" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>
    <label class="field">Пароль
      <input class="plain" type="password" name="password" autocomplete="current-password">
    </label>
    <button class="button primary" type="submit">Войти</button>
  </form>
</div>
{% endblock %}
