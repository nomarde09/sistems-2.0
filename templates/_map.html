{% set links = map_links(r.location, r.address) %}
{% if links %}
<div class="map-buttons">
  {% for l in links %}
    {% if loop.first %}
    <a class="button map-button wide" href="{{ l.url }}" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>{{ l.label }}</a>
    {% else %}
    <a class="button map-alt" href="{{ l.url }}" target="_blank" rel="noopener noreferrer">{{ l.label }}</a>
    {% endif %}
  {% endfor %}
</div>
{% endif %}
